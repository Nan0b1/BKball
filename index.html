<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <script defer src="script.js"></script>
    <title>BKball</title>
</head>
<body>
    <div class="flex_parent">
        <h1 class="flex_child">Hello</h1>
        <svg id="board" viewBox="0 0 140 200" style="background-color:rgb(209, 171, 45)" class="flex_child">
            <line id="left2" x2="5" y2="5" x1="0" y1="0" style="stroke:#dbbf54;stroke-width:2.5;stroke-dasharray:4" >
                <animate id="left21" attributeName="x1" values="0" dur=" 0.2s" fill="freeze"/>
                <animate id="left22" attributeName="y1" values="0" dur=" 0.2s" fill="freeze"/>
            </line>
            <line id="left1" x2="5" y2="5" x1="0" y1="0" style="stroke:#dbbf54;stroke-width:2" >
                <animate id="left11" attributeName="x1" values="0" dur=" 0.2s" fill="freeze"/>
                <animate id="left12" attributeName="y1" values="0" dur=" 0.2s" fill="freeze"/>
            </line>
            <line id="left3" x2="5" y2="5" x1="0" y1="0" style="stroke:#dbbf54;stroke-width:2.3;stroke-dasharray:3" >
                <animate id="left31" attributeName="x1" values="0" dur=" 0.2s" fill="freeze"/>
                <animate id="left32" attributeName="y1" values="0" dur=" 0.2s" fill="freeze"/>
            </line>
            <line id="right2" x2="135" y2="5"1x2="0" y1="0" style="stroke:#dbbf54;stroke-width:2.5;stroke-dasharray:4" >
                <animate id="right21" attributeName="x1" values="0" dur=" 0.2s" fill="freeze"/>
                <animate id="right22" attributeName="y1" values="0" dur=" 0.2s" fill="freeze"/>
            </line>
            <line id="right1" x2="135" y2="5"1x2="0" y1="0" style="stroke:#dbbf54;stroke-width:2" >
                <animate id="right11" attributeName="x1" values="0" dur=" 0.2s" fill="freeze"/>
                <animate id="right12" attributeName="y1" values="0" dur=" 0.2s" fill="freeze"/>
            </line>
            <line id="right3" x2="135" y2="5"1x2="0" y1="0" style="stroke:#dbbf54;stroke-width:2.3;stroke-dasharray:3" >
                <animate id="right31" attributeName="x1" values="0" dur=" 0.2s" fill="freeze"/>
                <animate id="right32" attributeName="y1" values="0" dur=" 0.2s" fill="freeze"/>
            </line>
            <circle cx="-4" cy="5" r="10" fill="#000000"/>
            <circle cx="144" cy="5" r="10" fill="#000000"/>
            <g id="myCircle">
                <circle cx="0" cy="0" r="2" fill="#000000"/>
                <circle cx="0" cy="11" r="9" stroke="black" fill="transparent" stroke-width="3.95"/>
                <!-- <circle cx="70" cy="173" r="7" fill="rgb(209, 171, 45)"/> -->
                <circle cx="0" cy="13" r="5" fill="#906100"/>
                <animateTransform 
                    id="circleAnimate"
                    attributeName="transform"
                    from="0 0"
                    to="0 0"
                    dur=" 0.2s"
                    fill="freeze"/>
            </g>
        </svg>
        <h1 class="flex_child">BKball</h1>
    </div>
</body>
</html>
